<text x="836" y="238" fill="#edb74e" font-size="16">01</text><text x="880" y="238" fill="#f6efda" font-size="20" font-weight="bold">Step outside</text>
<text x="880" y="266" fill="#aebeb8" font-size="15">Start behind your character in</text>
<text x="880" y="288" fill="#aebeb8" font-size="15">Safehouse Lane. Look toward the</text>
<text x="880" y="310" fill="#aebeb8" font-size="15">tea stall; follow the gold trail.</text>
<text x="836" y="371" fill="#edb74e" font-size="16">02</text><text x="880" y="371" fill="#f6efda" font-size="20" font-weight="bold">Collect the parcel</text>
<text x="880" y="399" fill="#aebeb8" font-size="15">Walk or sprint to Namma Tea.</text>
<text x="880" y="421" fill="#aebeb8" font-size="15">Look at the counter and press E.</text>
<text x="880" y="443" fill="#aebeb8" font-size="15">The parcel appears on your back.</text>
<text x="836" y="504" fill="#edb74e" font-size="16">03</text><text x="880" y="504" fill="#f6efda" font-size="20" font-weight="bold">Cross Market Court</text>
<text x="880" y="532" fill="#aebeb8" font-size="15">Turn through the courtyard.</text>
<text x="880" y="554" fill="#aebeb8" font-size="15">Try the ramp, jump, and explore</text>
<text x="880" y="576" fill="#aebeb8" font-size="15">the shade of the street trees.</text>
<text x="836" y="637" fill="#edb74e" font-size="16">04</text><text x="880" y="637" fill="#f6efda" font-size="20" font-weight="bold">Make your delivery</text>
<text x="880" y="665" fill="#aebeb8" font-size="15">Reach Corner Stores and press E.</text>
<text x="880" y="687" fill="#aebeb8" font-size="15">See completion, then press R</text>
<text x="880" y="709" fill="#aebeb8" font-size="15">to reset and walk the route again.</text>
