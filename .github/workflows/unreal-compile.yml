name: Unreal compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Source/**"
      - "Config/**"
      - "NammaCity.uproject"
      - ".github/workflows/unreal-compile.yml"

permissions:
  contents: read

jobs:
  compile-editor:
    runs-on: [self-hosted, linux, unreal]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Compile NammaCityEditor
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
        run: Scripts/build_editor.sh
      - name: Archive Unreal logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unreal-build-logs
          path: Saved/Logs
          if-no-files-found: ignore
